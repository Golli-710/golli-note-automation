[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "golli-note-automation"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["playwright>=1.48,<2"]

[project.scripts]
note-automation = "note_automation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
